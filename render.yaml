services:
  - type: web
    name: pelec-api
    runtime: python

    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"

    startCommand: "cd backend && gunicorn backend.wsgi:application"

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

      # Set in Render dashboard (recommended)
      - key: SECRET_KEY
        value: ""
      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: pelec-db
          property: connectionString

      - key: ALLOWED_HOSTS
        value: "yourdomain.onrender.com,www.yourdomain.onrender.com"
      - key: FRONTEND_URLS
        value: "https://event-management-indol-phi.vercel.app/"

databases:
  - name: pelec-db
    plan: standard
    region: oregon
