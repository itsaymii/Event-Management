services:
  - type: web
    name: pelec-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn backend.wsgi"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        value: "YOUR_SECRET_KEY_HERE"
        isFile: false
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: postgres_db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "yourdomain.onrender.com,www.yourdomain.onrender.com"
      - key: FRONTEND_URLS
        value: "https://your-frontend.vercel.app"

databases:
  - name: postgres_db
    plan: standard
    version: "14"
    region: "oregon"  # Change to your region
